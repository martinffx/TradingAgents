interactions:
- request:
    body: '{"messages":[{"content":"You are a financial news sentiment analyst. Always
      respond with valid JSON in the specified format.","role":"system"},{"content":"Analyze
      the sentiment of this financial news article. Respond with JSON in this exact
      format:\n        {\n        \"sentiment\": \"positive|negative|neutral\",\n        \"confidence\":
      0.0-1.0,\n        \"reasoning\": \"Brief explanation\"\n        }\n\n        Article:\n        \n        Apple
      Inc. reported strong quarterly earnings that beat analyst expectations, \n        sending
      the stock higher in after-hours trading. The tech giant posted revenue \n        of
      $89.5 billion, up 8% from the same quarter last year, with earnings per share
      \n        of $1.26, exceeding the expected $1.20. iPhone sales remained robust,
      and the \n        company''s services segment showed significant growth. Management
      raised its \n        guidance for the upcoming quarter, citing strong demand
      across all product lines.\n        \n\n        Focus on:\n        - Overall
      market/stock sentiment impact\n        - Financial performance indicators\n        -
      Risk factors mentioned\n        - Business outlook expressed\n\n        Consider
      financial context and avoid overreacting to minor fluctuations. Be objective
      and data-driven.","role":"user"}],"model":"anthropic/claude-3.5-sonnet","stream":false,"temperature":0.1}'
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      content-length:
      - '1367'
      content-type:
      - application/json
      host:
      - openrouter.ai
      x-stainless-arch:
      - arm64
      x-stainless-async:
      - async:asyncio
      x-stainless-lang:
      - python
      x-stainless-os:
      - MacOS
      x-stainless-package-version:
      - 1.86.0
      x-stainless-retry-count:
      - '1'
      x-stainless-runtime:
      - CPython
      x-stainless-runtime-version:
      - 3.13.1
    method: POST
    uri: https://openrouter.ai/api/v1/chat/completions
  response:
    body:
      string: '{"error":{"message":"No auth credentials found","code":401}}'
    headers:
      Access-Control-Allow-Origin:
      - '*'
      CF-RAY:
      - 9a22c10dfc407ddd-AMS
      Connection:
      - keep-alive
      Content-Type:
      - application/json
      Date:
      - Fri, 21 Nov 2025 19:57:05 GMT
      Permissions-Policy:
      - payment=(self "https://checkout.stripe.com" "https://connect-js.stripe.com"
        "https://js.stripe.com" "https://*.js.stripe.com" "https://hooks.stripe.com")
      Referrer-Policy:
      - no-referrer, strict-origin-when-cross-origin
      Server:
      - cloudflare
      Transfer-Encoding:
      - chunked
      Vary:
      - Accept-Encoding
      X-Content-Type-Options:
      - nosniff
    status:
      code: 401
      message: Unauthorized
version: 1
