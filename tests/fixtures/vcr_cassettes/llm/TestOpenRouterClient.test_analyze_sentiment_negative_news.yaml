interactions:
- request:
    body: '{"messages":[{"content":"You are a financial news sentiment analyst. Always
      respond with valid JSON in the specified format.","role":"system"},{"content":"Analyze
      the sentiment of this financial news article. Respond with JSON in this exact
      format:\n        {\n        \"sentiment\": \"positive|negative|neutral\",\n        \"confidence\":
      0.0-1.0,\n        \"reasoning\": \"Brief explanation\"\n        }\n\n        Article:\n        \n        Wells
      Fargo & Co. reported disappointing quarterly results as rising \n        interest
      rates impacted its lending business. The bank''s net income \n        fell 23%
      to $3.5 billion, missing analyst expectations. provisions for \n        credit
      losses increased significantly, reflecting concerns about \n        potential
      loan defaults in a higher-rate environment. The stock \n        declined sharply
      on the news.\n        \n\n        Focus on:\n        - Overall market/stock
      sentiment impact\n        - Financial performance indicators\n        - Risk
      factors mentioned\n        - Business outlook expressed\n\n        Consider
      financial context and avoid overreacting to minor fluctuations. Be objective
      and data-driven.","role":"user"}],"model":"anthropic/claude-3.5-sonnet","stream":false,"temperature":0.1}'
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, zstd
      connection:
      - keep-alive
      content-length:
      - '1260'
      content-type:
      - application/json
      host:
      - openrouter.ai
      x-stainless-arch:
      - arm64
      x-stainless-async:
      - async:asyncio
      x-stainless-lang:
      - python
      x-stainless-os:
      - MacOS
      x-stainless-package-version:
      - 1.86.0
      x-stainless-retry-count:
      - '1'
      x-stainless-runtime:
      - CPython
      x-stainless-runtime-version:
      - 3.13.1
    method: POST
    uri: https://openrouter.ai/api/v1/chat/completions
  response:
    body:
      string: '{"error":{"message":"No auth credentials found","code":401}}'
    headers:
      Access-Control-Allow-Origin:
      - '*'
      CF-RAY:
      - 9a22c111cbb30ea8-AMS
      Connection:
      - keep-alive
      Content-Type:
      - application/json
      Date:
      - Fri, 21 Nov 2025 19:57:06 GMT
      Permissions-Policy:
      - payment=(self "https://checkout.stripe.com" "https://connect-js.stripe.com"
        "https://js.stripe.com" "https://*.js.stripe.com" "https://hooks.stripe.com")
      Referrer-Policy:
      - no-referrer, strict-origin-when-cross-origin
      Server:
      - cloudflare
      Transfer-Encoding:
      - chunked
      Vary:
      - Accept-Encoding
      X-Content-Type-Options:
      - nosniff
    status:
      code: 401
      message: Unauthorized
version: 1
