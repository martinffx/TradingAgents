interactions:
- request:
    body: '{"messages":[{"role":"system","content":"You are a financial news sentiment
      analyst. Always respond with valid JSON in the specified format."},{"role":"user","content":"Analyze
      the sentiment of this financial news article.\n\n---\nCONTENT START\\n\n[Continued]
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n---\nCONTENT
      END\n\nRespond with JSON in this exact format:\n{\"sentiment\": \"positive|negative|neutral\",
      \"confidence\": 0.0-1.0, \"reasoning\": \"Brief explanation\"}\n\nFocus on:\n-
      Overall market/stock sentiment impact\n- Financial performance indicators\n-
      Risk factors mentioned\n- Business outlook expressed"}],"model":"anthropic/claude-3.5-sonnet","temperature":0.1}'
    headers:
      accept:
      - application/json
      accept-encoding:
      - gzip, deflate, br, zstd
      connection:
      - keep-alive
      content-length:
      - '1340'
      content-type:
      - application/json
      host:
      - openrouter.ai
      x-stainless-runtime:
      - CPython
    method: POST
    uri: https://openrouter.ai/api/v1/chat/completions
  response:
    body:
      string: '{"error":{"message":"Missing Authentication header","code":401}}'
    headers:
      Access-Control-Allow-Origin:
      - '*'
      CF-RAY:
      - 9e03ef7efa1f6614-AMS
      Connection:
      - keep-alive
      Content-Type:
      - application/json
      Date:
      - Sun, 22 Mar 2026 08:48:07 GMT
      Permissions-Policy:
      - payment=(self "https://checkout.stripe.com" "https://connect-js.stripe.com"
        "https://js.stripe.com" "https://*.js.stripe.com" "https://hooks.stripe.com")
      Referrer-Policy:
      - no-referrer, strict-origin-when-cross-origin
      Server:
      - cloudflare
      Transfer-Encoding:
      - chunked
      X-Content-Type-Options:
      - nosniff
    status:
      code: 401
      message: Unauthorized
version: 1
